<h2>Short URL details</h2>

<div class="card">
  @if (isLoading()) {
    <p>Loading…</p>
  } @else if (loadError()) {
    <p class="error">{{ loadError() }}</p>
    <button (click)="goBack()">Back to table</button>
  } @else if (details(); as d) {
    <dl style="display:grid; grid-template-columns: 180px 1fr; row-gap:0.75rem;">
      <dt><strong>Original URL</strong></dt>
      <dd><a [href]="d.originalUrl" target="_blank" rel="noopener">{{ d.originalUrl }}</a></dd>

      <dt><strong>Short URL</strong></dt>
      <dd><a [href]="d.originalUrl" target="_blank" rel="noopener">{{ d.shortUrl }}</a></dd>

      <dt><strong>Created By</strong></dt>
      <dd>{{ d.createdByUserName }}</dd>

      <dt><strong>Created Date</strong></dt>
      <dd>{{ d.createdDate | date: 'medium' }}</dd>

      <!-- <dt><strong>Visit Count</strong></dt>
      <dd>{{ d.visitCount }}</dd> -->
    </dl>

    <button (click)="goBack()" style="margin-top:1rem;">Back to table</button>
  }
</div>
